name: Generate Synthwave Stats

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history so the rebase before pushing works

      - name: Clone github-readme-stats
        run: git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start local server and generate the glowing SVGs
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN }}
        run: |
          cd github-readme-stats
          npm ci
          npm install express

          PORT=9000 node express.js > server.log 2>&1 &
          sleep 5

          echo "==== SERVER BOOT LOGS ===="
          cat server.log
          echo "=========================="

          curl --retry 5 --retry-delay 2 --retry-connrefused -f -s \
            "http://127.0.0.1:9000/api?username=Hamidreza-Ebrahimi&theme=synthwave&show_icons=true&hide_border=true&count_private=true&include_all_commits=true" \
            -o ../synthwave-stats.svg
          curl --retry 5 --retry-delay 2 --retry-connrefused -f -s \
            "http://127.0.0.1:9000/api/top-langs/?username=Hamidreza-Ebrahimi&theme=synthwave&layout=compact&hide_border=true" \
            -o ../synthwave-langs.svg

      - name: Clean up and commit
        run: |
          rm -rf github-readme-stats

          # Must stay an email registered on your GitHub account, or these
          # commits stop counting toward your contribution graph.
          git config --global user.name "Hamidreza-Ebrahimi"
          git config --global user.email "major.hamidreza@gmail.com"

          git add synthwave-stats.svg synthwave-langs.svg
          git commit -m "Update synthwave stats" || exit 0

          # Pull any edits made to main before pushing, to avoid conflicts
          git pull --rebase origin main
          git push
